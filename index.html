<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Earth Rotations</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body { height:100%; margin:0; background:#000; font-family:system-ui, sans-serif; overflow:hidden; }
    #container { width:100%; height:100vh; position:relative; }
    canvas { display:block; width:100%; height:100%; }
    .ui {
      position:absolute; right:16px; top:16px; z-index:10;
      display:flex; flex-direction:column; gap:8px;
    }
    .country-picker {
      position:absolute; left:50%; top:18px; z-index:10;
      transform:translateX(-50%); width:min(360px, calc(100% - 32px));
      display:flex; gap:8px; align-items:center;
      padding:10px; background:rgba(5, 15, 28, 0.82);
      border:1px solid rgba(255,255,255,0.16); border-radius:10px;
      backdrop-filter:blur(8px);
    }
    .country-picker label { color:#b9d8e8; font-size:12px; white-space:nowrap; }
    #countrySelect { min-width:0; flex:1; padding:8px; color:#fff; background:#102334; border:1px solid #31536a; border-radius:6px; }
    .earthquake-panel {
      position:absolute; right:16px; bottom:16px; z-index:11;
      width:min(390px, calc(100% - 32px)); max-height:min(58vh, 540px);
      overflow:auto; padding:16px; color:#eef8ff;
      background:rgba(5, 15, 28, 0.92); border:1px solid rgba(126, 211, 255, 0.28);
      border-radius:10px; backdrop-filter:blur(10px);
    }
    .panel-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .panel-heading h2 { margin:0; font-size:18px; }
    #closePanel { color:#fff; background:transparent; border:1px solid #31536a; border-radius:5px; cursor:pointer; padding:5px 8px; }
    .earthquake-item { padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.1); }
    .earthquake-item strong { color:#ffd166; }
    .earthquake-item small { display:block; color:#b9d8e8; margin-top:4px; line-height:1.4; }
    .panel-status { color:#b9d8e8; font-size:13px; }
    .ui button {
      background: rgba(255,255,255,0.08);
      color:#fff; border:1px solid rgba(255,255,255,0.12);
      padding:8px 10px; border-radius:6px; cursor:pointer;
      backdrop-filter: blur(4px);
    }
    .credits {
      position:absolute; left:12px; bottom:12px; color:#ddd;
      font-size:13px; background: rgba(0,0,0,0.35); padding:6px 8px; border-radius:6px;
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <div class="country-picker">
    <label for="countrySelect">Explorar país</label>
    <select id="countrySelect">
      <option value="">Cargando países...</option>
    </select>
  </div>

  <aside id="earthquakePanel" class="earthquake-panel" hidden>
    <div class="panel-heading">
      <h2 id="panelTitle">Sismos recientes</h2>
      <button id="closePanel" type="button" aria-label="Cerrar panel">Cerrar</button>
    </div>
    <p id="panelStatus" class="panel-status">Selecciona un país para consultar los datos.</p>
    <div id="earthquakeList"></div>
  </aside>

  <div class="ui" aria-hidden="true">
    <button id="leftBtn">◀︎ Left</button>
    <button id="rightBtn">Right ▶︎</button>
    <button id="upBtn">▲ Up</button>
    <button id="downBtn">Down ▼</button>
    <button id="zoomInBtn">＋ Zoom In</button>
    <button id="zoomOutBtn">－ Zoom Out</button>
    <button id="autoRotateBtn">Toggle Auto Rotate</button>
    <button id="resetBtn">Reset</button>
  </div>

  <div class="credits">By Eilen-Fonseca-Garrote using jsdelivr.net :D and threejs.org• </div>

  <!-- Only Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

  <script>
    const container = document.getElementById('container');

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    // Scene + Camera
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.0008);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
    let cameraDistance = 6;
    const minDistance = 2.2;
    const maxDistance = 12;
    camera.position.set(0, 0, cameraDistance);

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.45));
    const dir = new THREE.DirectionalLight(0xffffff, 1.0);
    dir.position.set(5, 3, 5);
    scene.add(dir);

    // Textures
    const loader = new THREE.TextureLoader();
    const earthMap = loader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
    const cloudsMap = loader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png');

    // Earth group
    const earthGroup = new THREE.Group();
    scene.add(earthGroup);

    const RADIUS = 1.8;
    const earthGeo = new THREE.SphereGeometry(RADIUS, 64, 64);
    const earthMat = new THREE.MeshPhongMaterial({ map: earthMap });
    const earthMesh = new THREE.Mesh(earthGeo, earthMat);
    earthGroup.add(earthMesh);

    const cloudGeo = new THREE.SphereGeometry(RADIUS + 0.02, 64, 64);
    const cloudMat = new THREE.MeshLambertMaterial({ map: cloudsMap, transparent: true, opacity: 0.9, depthWrite: false });
    const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
    earthGroup.add(cloudMesh);

    // Stars background
    (function createStars(){
      const starGeometry = new THREE.BufferGeometry();
      const starCount = 5000;
      const positions = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount; i++) {
        const i3 = i * 3;
        const r = 100 + Math.random() * 400;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        positions[i3] = r * Math.sin(phi) * Math.cos(theta);
        positions[i3+1] = r * Math.sin(phi) * Math.sin(theta);
        positions[i3+2] = r * Math.cos(phi);
      }
      starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7, sizeAttenuation: true });
      scene.add(new THREE.Points(starGeometry, starMaterial));
    })();

    // Interaction state (custom controls)
    let isPointerDown = false;
    let lastX = 0, lastY = 0;
    let targetRotX = 0, targetRotY = 0; // target rotations for smoothing
    const rotSmoothing = 0.12;
    let autoRotate = false;

    // initial tilt for nicer view
    earthGroup.rotation.x = 0.4;
    earthGroup.rotation.y = 0.4;

    // Pointer handlers on canvas
    renderer.domElement.addEventListener('pointerdown', (e) => {
      isPointerDown = true;
      lastX = e.clientX;
      lastY = e.clientY;
      renderer.domElement.setPointerCapture(e.pointerId);
    });
    renderer.domElement.addEventListener('pointermove', (e) => {
      if (!isPointerDown) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      // horizontal drag => rotate around Y
      targetRotY += dx * 0.005;
      // vertical drag => rotate around X (limited)
      targetRotX += dy * 0.005;
      targetRotX = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, targetRotX));
    });
    renderer.domElement.addEventListener('pointerup', (e) => {
      isPointerDown = false;
      try { renderer.domElement.releasePointerCapture(e.pointerId); } catch {}
    });
    renderer.domElement.addEventListener('pointercancel', () => { isPointerDown = false; });

    // Wheel zoom
    renderer.domElement.addEventListener('wheel', (e) => {
      e.preventDefault();
      cameraDistance += e.deltaY * 0.01;
      cameraDistance = Math.min(maxDistance, Math.max(minDistance, cameraDistance));
    }, { passive: false });

    // Touch pinch support (simple)
    let lastDistance = null;
    renderer.domElement.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        lastDistance = Math.hypot(dx, dy);
      }
    }, { passive: true });
    renderer.domElement.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && lastDistance !== null) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.hypot(dx, dy);
        const diff = lastDistance - dist;
        cameraDistance += diff * 0.01;
        cameraDistance = Math.min(maxDistance, Math.max(minDistance, cameraDistance));
        lastDistance = dist;
      }
    }, { passive: true });
    renderer.domElement.addEventListener('touchend', (e) => { if (e.touches.length < 2) lastDistance = null; }, { passive: true });

    // Buttons
    document.getElementById('leftBtn').addEventListener('click', () => targetRotY -= 0.35);
    document.getElementById('rightBtn').addEventListener('click', () => targetRotY += 0.35);
    document.getElementById('upBtn').addEventListener('click', () => targetRotX -= 0.25);
    document.getElementById('downBtn').addEventListener('click', () => targetRotX += 0.25);
    document.getElementById('zoomInBtn').addEventListener('click', () => { cameraDistance = Math.max(minDistance, cameraDistance - 0.9); });
    document.getElementById('zoomOutBtn').addEventListener('click', () => { cameraDistance = Math.min(maxDistance, cameraDistance + 0.9); });
    document.getElementById('autoRotateBtn').addEventListener('click', () => {
      if (earthquakePanelOpen) return;
      autoRotate = !autoRotate;
      document.getElementById('autoRotateBtn').textContent = autoRotate ? 'Auto Rotate: ON' : 'Toggle Auto Rotate';
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
      targetRotX = 0.4; targetRotY = 0.4;
      cameraDistance = 6;
      autoRotate = false;
      document.getElementById('autoRotateBtn').textContent = 'Toggle Auto Rotate';
    });

    const countrySelect = document.getElementById('countrySelect');
    const earthquakePanel = document.getElementById('earthquakePanel');
    const panelTitle = document.getElementById('panelTitle');
    const panelStatus = document.getElementById('panelStatus');
    const earthquakeList = document.getElementById('earthquakeList');
    const API_URL = 'http://localhost:8080/api/earthquakes';
    let earthquakePanelOpen = false;
    let selectedCountry = null;

    async function loadCountries() {
      try {
        const response = await fetch('http://localhost:8080/api/countries');
        if (!response.ok) throw new Error('No se pudo cargar el catálogo');
        const countries = await response.json();
        countries.sort((a, b) => a.name.common.localeCompare(b.name.common));
        countries.forEach((country) => {
          if (!country.cca2 || !country.latlng || country.latlng.length < 2) return;
          const option = document.createElement('option');
          option.value = country.cca2;
          option.textContent = country.name.common;
          option.dataset.latitude = country.latlng[0];
          option.dataset.longitude = country.latlng[1];
          countrySelect.appendChild(option);
        });
        countrySelect.querySelector('option[value=""]').textContent = 'Selecciona un país';
      } catch (error) {
        countrySelect.innerHTML = '<option value="">No se pudo cargar el catálogo</option>';
        panelStatus.textContent = 'No se pudo cargar el catálogo de países.';
      }
    }

    function rotateToCountry(latitude, longitude) {
      targetRotX = THREE.MathUtils.clamp(latitude * Math.PI / 180, -Math.PI / 2 + 0.1, Math.PI / 2 - 0.1);
      targetRotY = -longitude * Math.PI / 180 - Math.PI / 2;
      cameraDistance = 4.2;
    }

    function fitCountry(bounds, fallbackCountry, earthquakes) {
      const eventLongitudes = earthquakes.map((earthquake) => earthquake.longitude);
      const eventLatitudes = earthquakes.map((earthquake) => earthquake.latitude);
      const minLongitude = eventLongitudes.length ? Math.min(...eventLongitudes) : bounds?.minLongitude ?? fallbackCountry.longitude;
      const maxLongitude = eventLongitudes.length ? Math.max(...eventLongitudes) : bounds?.maxLongitude ?? fallbackCountry.longitude;
      const minLatitude = bounds?.minLatitude ?? (eventLatitudes.length ? Math.min(...eventLatitudes) : fallbackCountry.latitude);
      const maxLatitude = bounds?.maxLatitude ?? (eventLatitudes.length ? Math.max(...eventLatitudes) : fallbackCountry.latitude);
      const centerLatitude = (minLatitude + maxLatitude) / 2;
      const centerLongitude = (minLongitude + maxLongitude) / 2;
      const span = Math.max(maxLatitude - minLatitude, maxLongitude - minLongitude);
      targetRotX = THREE.MathUtils.clamp(centerLatitude * Math.PI / 180, -Math.PI / 2 + 0.1, Math.PI / 2 - 0.1);
      targetRotY = -centerLongitude * Math.PI / 180 - Math.PI / 2;
      cameraDistance = THREE.MathUtils.clamp(4.2 + span * 0.04, 4.2, 11);
    }

    function distanceInKm(first, second) {
      const earthRadius = 6371;
      const lat1 = first.latitude * Math.PI / 180;
      const lat2 = second.latitude * Math.PI / 180;
      const deltaLat = (second.latitude - first.latitude) * Math.PI / 180;
      const deltaLon = (second.longitude - first.longitude) * Math.PI / 180;
      const value = Math.sin(deltaLat / 2) ** 2
        + Math.cos(lat1) * Math.cos(lat2) * Math.sin(deltaLon / 2) ** 2;
      return earthRadius * 2 * Math.atan2(Math.sqrt(value), Math.sqrt(1 - value));
    }

    function renderEarthquakes(earthquakes) {
      earthquakeList.innerHTML = '';
      if (!earthquakes.length) {
        earthquakeList.innerHTML = '<p class="panel-status">No hay sismos cercanos en las últimas 24 horas.</p>';
        return;
      }
      earthquakes.forEach((earthquake) => {
        const item = document.createElement('article');
        item.className = 'earthquake-item';
        item.innerHTML = `<strong>Magnitud ${earthquake.magnitude.toFixed(1)}</strong> · ${earthquake.place || 'Ubicación desconocida'}<small>Profundidad: ${earthquake.depth.toFixed(1)} km · ${new Date(earthquake.occurredAt).toLocaleString()}</small>`;
        earthquakeList.appendChild(item);
      });
    }

    async function showCountryEarthquakes(country) {
      earthquakePanel.hidden = false;
      panelTitle.textContent = `Sismos en ${country.name}`;
      panelStatus.textContent = 'Consultando los últimos sismos...';
      earthquakeList.innerHTML = '';
      try {
        const [earthquakeResponse, boundsResponse] = await Promise.all([
          fetch(`${API_URL}?country=${encodeURIComponent(country.code)}`),
          fetch(`http://localhost:8080/api/countries/${encodeURIComponent(country.code)}/bounds`)
        ]);
        if (!earthquakeResponse.ok || !boundsResponse.ok) throw new Error('API no disponible');
        const earthquakes = await earthquakeResponse.json();
        const bounds = await boundsResponse.json();
        fitCountry(bounds, country, earthquakes);
        panelStatus.textContent = `${earthquakes.length} eventos encontrados en el país.`;
        renderEarthquakes(earthquakes);
      } catch (error) {
        panelStatus.textContent = 'No se pudo conectar con Spring Boot. Comprueba que el backend esté activo.';
      }
    }

    countrySelect.addEventListener('change', () => {
      const option = countrySelect.selectedOptions[0];
      if (!option.value) return;
      earthquakePanelOpen = true;
      autoRotate = false;
      earthMesh.rotation.y = 0;
      cloudMesh.rotation.y = 0;
      document.getElementById('autoRotateBtn').textContent = 'Auto Rotate: OFF';
      selectedCountry = {
        name: option.textContent,
        code: option.value,
        latitude: Number(option.dataset.latitude),
        longitude: Number(option.dataset.longitude)
      };
      rotateToCountry(selectedCountry.latitude, selectedCountry.longitude);
      showCountryEarthquakes(selectedCountry);
    });
    document.getElementById('closePanel').addEventListener('click', () => {
      earthquakePanel.hidden = true;
      earthquakePanelOpen = false;
      autoRotate = true;
      document.getElementById('autoRotateBtn').textContent = 'Auto Rotate: ON';
    });
    loadCountries();

    // Animation loop
    const clock = new THREE.Clock();
    function animate() {
      const dt = clock.getDelta();

      if (autoRotate) {
        targetRotY += 0.0018 * dt * 60;
      }

      // smooth lerp toward target rotation
      earthGroup.rotation.x += (targetRotX - earthGroup.rotation.x) * rotSmoothing;
      earthGroup.rotation.y += (targetRotY - earthGroup.rotation.y) * rotSmoothing;

      // update camera position from cameraDistance (camera looks at origin)
      camera.position.set(0, 0, cameraDistance);
      camera.lookAt(new THREE.Vector3(0, 0, 0));

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // set initial targets
    targetRotX = earthGroup.rotation.x;
    targetRotY = earthGroup.rotation.y;
  </script>
</body>
    </html>
